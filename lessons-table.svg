<svg width="700" height="412" viewBox="0 0 700 412" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .f { font-family: Inter, system-ui, sans-serif; }
      .f-ser { font-family: Georgia, 'Times New Roman', serif; }
    </style>
    <marker id="tip" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#c2410c"/>
    </marker>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="700" height="412" fill="#ffffff"/>

  <!-- Right column warm tint -->
  <rect x="418" y="32" width="282" height="380" fill="#fff9f5"/>

  <!-- Orange accent bar separating columns -->
  <rect x="418" y="32" width="3" height="380" fill="#c2410c"/>

  <!-- ── HEADER ── -->
  <rect x="0" y="0" width="700" height="32" fill="#0a0a0a"/>
  <text x="16" y="21" class="f" font-size="9" font-weight="700" letter-spacing="2" fill="#ffffff">FIVE COUNTER-STRATEGIES FOR CONTESTERS</text>
  <text x="684" y="21" class="f" font-size="9" font-weight="400" letter-spacing=".5" fill="#9ca3af" text-anchor="end">Push and Pushback in Contesting AI · FAccT 2026</text>

  <!-- Column sub-headers -->
  <rect x="0" y="32" width="418" height="22" fill="#f5f5f5"/>
  <rect x="421" y="32" width="279" height="22" fill="#fff0e6"/>
  <text x="62" y="46" class="f" font-size="7.5" font-weight="700" letter-spacing="1.5" fill="#555555">LESSON FOR CONTESTERS</text>
  <text x="434" y="46" class="f" font-size="7.5" font-weight="700" letter-spacing="1.5" fill="#c2410c">INSTITUTIONAL STRATEGY COUNTERED</text>

  <!-- Sub-header bottom line -->
  <line x1="0" y1="54" x2="700" y2="54" stroke="#e0e0e0" stroke-width=".75"/>

  <!-- ════════════ ROW 1  y=54–130 ════════════ -->
  <!-- Large background number -->
  <text x="10" y="116" class="f" font-size="58" font-weight="800" fill="#f0f0f0">01</text>
  <!-- Lesson content -->
  <text x="62" y="74"  class="f" font-size="7"    font-weight="700" letter-spacing="1.5" fill="#9ca3af">EVIDENCE</text>
  <text x="62" y="89"  class="f" font-size="12.5" font-weight="700" fill="#0a0a0a">Build Evidence of Harm</text>
  <text x="62" y="105" class="f" font-size="10"   fill="#6b7280">Document harms and map the full accountability chain</text>
  <text x="62" y="120" class="f" font-size="10"   fill="#6b7280">early, before institutions can reframe the narrative.</text>
  <!-- Right col -->
  <text x="434" y="74"  class="f" font-size="7.5" font-weight="700" letter-spacing="1" fill="#c2410c">§4.2.1 – §4.2.2</text>
  <text x="434" y="89"  class="f" font-size="11"  font-weight="600" fill="#0a0a0a">Deny Responsibility &amp; Harm</text>
  <text x="434" y="105" class="f" font-size="9.5" fill="#7a3020">Claim autonomy; dismiss or minimize injury</text>
  <!-- Row separator -->
  <line x1="0" y1="130" x2="700" y2="130" stroke="#e8e8e8" stroke-width=".75"/>

  <!-- ════════════ ROW 2  y=130–206 ════════════ -->
  <text x="10" y="192" class="f" font-size="58" font-weight="800" fill="#f0f0f0">02</text>
  <text x="62" y="150" class="f" font-size="7"    font-weight="700" letter-spacing="1.5" fill="#9ca3af">FRAMING</text>
  <text x="62" y="165" class="f" font-size="12.5" font-weight="700" fill="#0a0a0a">Frame Contestation Strategically</text>
  <text x="62" y="181" class="f" font-size="10"   fill="#6b7280">Center due process and procedural rights — not</text>
  <text x="62" y="196" class="f" font-size="10"   fill="#6b7280">technical specs that institutions can easily refute.</text>
  <text x="434" y="150" class="f" font-size="7.5" font-weight="700" letter-spacing="1" fill="#c2410c">§4.2.4 – §4.2.5</text>
  <text x="434" y="165" class="f" font-size="11"  font-weight="600" fill="#0a0a0a">Justify &amp; Avoid Scrutiny</text>
  <text x="434" y="181" class="f" font-size="9.5" fill="#7a3020">Defend AI as optimal; shield algorithm from review</text>
  <line x1="0" y1="206" x2="700" y2="206" stroke="#e8e8e8" stroke-width=".75"/>

  <!-- ════════════ ROW 3  y=206–282 ════════════ -->
  <text x="10" y="268" class="f" font-size="58" font-weight="800" fill="#f0f0f0">03</text>
  <text x="62" y="226" class="f" font-size="7"    font-weight="700" letter-spacing="1.5" fill="#9ca3af">IMPLEMENTATION</text>
  <text x="62" y="241" class="f" font-size="12.5" font-weight="700" fill="#0a0a0a">Treat Implementation as a Distinct Stage</text>
  <text x="62" y="257" class="f" font-size="10"   fill="#6b7280">Plan past the win — sustain pressure through</text>
  <text x="62" y="272" class="f" font-size="10"   fill="#6b7280">implementation; concessions are often strategic delay.</text>
  <text x="434" y="226" class="f" font-size="7.5" font-weight="700" letter-spacing="1" fill="#c2410c">§4.2.6</text>
  <text x="434" y="241" class="f" font-size="11"  font-weight="600" fill="#0a0a0a">Strategic Concession &amp; Delay</text>
  <text x="434" y="257" class="f" font-size="9.5" fill="#7a3020">Surface fixes; exhaust contesters over time</text>
  <line x1="0" y1="282" x2="700" y2="282" stroke="#e8e8e8" stroke-width=".75"/>

  <!-- ════════════ ROW 4  y=282–358 ════════════ -->
  <text x="10" y="344" class="f" font-size="58" font-weight="800" fill="#f0f0f0">04</text>
  <text x="62" y="302" class="f" font-size="7"    font-weight="700" letter-spacing="1.5" fill="#9ca3af">COLLECTIVE ACTION</text>
  <text x="62" y="317" class="f" font-size="12.5" font-weight="700" fill="#0a0a0a">Enable Collective Action</text>
  <text x="62" y="333" class="f" font-size="10"   fill="#6b7280">Build shared tools, complaint templates, and reporting</text>
  <text x="62" y="348" class="f" font-size="10"   fill="#6b7280">infrastructure to pool resources against systemic harms.</text>
  <text x="434" y="302" class="f" font-size="7.5" font-weight="700" letter-spacing="1" fill="#c2410c">§4.2.3</text>
  <text x="434" y="317" class="f" font-size="11"  font-weight="600" fill="#0a0a0a">Restrict Contestation</text>
  <text x="434" y="333" class="f" font-size="9.5" fill="#7a3020">Close off legal and procedural avenues for challenge</text>
  <line x1="0" y1="358" x2="700" y2="358" stroke="#e8e8e8" stroke-width=".75"/>

  <!-- ════════════ ROW 5  y=358–412 ════════════ -->
  <!-- Slightly darker background to indicate "covers all" -->
  <rect x="0" y="358" width="418" height="54" fill="#fafafa"/>
  <rect x="421" y="358" width="279" height="54" fill="#fff3ec"/>
  <text x="10" y="412" class="f" font-size="58" font-weight="800" fill="#ebebeb">05</text>
  <text x="62" y="378" class="f" font-size="7"    font-weight="700" letter-spacing="1.5" fill="#9ca3af">INFRASTRUCTURE</text>
  <text x="62" y="393" class="f" font-size="12.5" font-weight="700" fill="#0a0a0a">Build Public-Interest Infrastructure</text>
  <text x="62" y="408" class="f" font-size="10"   fill="#6b7280">Sustain shared harm repositories and cross-case coordination.</text>
  <text x="434" y="378" class="f" font-size="7.5" font-weight="700" letter-spacing="1" fill="#c2410c">ALL §4.2</text>
  <text x="434" y="393" class="f" font-size="11"  font-weight="600" fill="#0a0a0a">Full Institutional Arsenal</text>
  <text x="434" y="408" class="f" font-size="9.5" fill="#7a3020">All six resistance strategies combined</text>

  <!-- ── OUTER BORDER ── -->
  <rect x="0" y="0" width="700" height="412" fill="none" stroke="#0a0a0a" stroke-width="1"/>
</svg>
